<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DPE print fixture</title>
  <style>
    body { margin: 0; padding: 24px; background: #eef2f7; font: 16px/1.6 sans-serif; }
    header, nav, aside { padding: 16px; margin-bottom: 16px; background: #dbe4f0; }
    main { max-width: 820px; margin: auto; padding: 28px; background: white; }
    .question { margin: 0 0 28px; padding-bottom: 18px; border-bottom: 1px solid #d9e0e8; }
    .question h2 { font-size: 1.05rem; }
    .figure { max-width: 100%; padding: 18px; background: #f6f8fb; text-align: center; }
  </style>
</head>
<body>
  <header>서비스 헤더 — 인쇄 대상에서 제외</header>
  <nav>탐색 메뉴 — 인쇄 대상에서 제외</nav>
  <main id="sample-paper">
    <h1>수학 형성평가</h1>
    <p>이 main 영역을 인쇄 대상으로 선택해 보세요.</p>
    <section class="question">
      <h2>1. 다음 식의 값을 구하시오.</h2>
      <p>3x + 2 = 11일 때, x의 값은?</p>
      <ol><li>1</li><li>2</li><li>3</li><li>4</li><li>5</li></ol>
    </section>
    <section class="question">
      <h2>2. 다음 자료를 보고 물음에 답하시오.</h2>
      <div class="figure">그래프·도형·이미지 테스트 영역</div>
      <p>위 자료를 바르게 해석한 것은?</p>
    </section>
  </main>
  <aside>추천 학습 및 하단 UI — 인쇄 대상에서 제외</aside>
</body>
</html>
